<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Home</title>
</head>
<body>
    <a href="https://jordan-morrison.github.io/TokenHunt">
        <h1>Home</h1>
    </a>
    <a href="https://jordan-morrison.github.io/TokenHunt/about">
        <h1>About</h1>
    </a>
    <a href="https://jordan-morrison.github.io/TokenHunt/contact">
        <h1>Contact</h1>
    </a>
    <a href="https://jordan-morrison.github.io/TokenHunt/tokenHunt">
        <h1>Token Hunt</h1>
    </a>
    <h2>Home Page</h2>
    <img id="CHAtoken1" src="token.png" onclick="tokenClicked('CHAtoken1')"/>

    <script>

        if (localStorage && localStorage.tokenHunt){
            let found = JSON.parse(localStorage.tokenHunt);
            if (found.includes("CHAtoken1")){
                document.getElementById("CHAtoken1").style = "display:none";
            }
        }

        function tokenClicked(token) {
            console.log("clicked:", token)
            if (localStorage){
                if (localStorage.tokenHunt){
                    let found = JSON.parse(localStorage.tokenHunt);
                    found.push(token);
                    localStorage.tokenHunt = JSON.stringify(found);
                }
                else {
                    localStorage.tokenHunt = JSON.stringify([token]);
                }
            }
            document.getElementById(token).style = "display:none";
        }
    </script>

</body>
</html>
