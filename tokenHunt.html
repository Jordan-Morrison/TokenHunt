<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Token Hunt</title>
</head>
<body>
    <a href="https://jordan-morrison.github.io/TokenHunt">
        <h1>Home</h1>
    </a>
    <a href="https://jordan-morrison.github.io/TokenHunt/about">
        <h1>About</h1>
    </a>
    <a href="https://jordan-morrison.github.io/TokenHunt/contact">
        <h1>Contact</h1>
    </a>
    <a href="https://jordan-morrison.github.io/TokenHunt/tokenHunt">
        <h1>Token Hunt</h1>
    </a>

    <h2>Token Hunt</h2>
    <div class="clueContainer">
        <div class="unknown" id="CHAtoken1"></div>
        <p>Some clue pointing to the home page</p>
    </div>
    <div class="clueContainer">
        <div class="unknown" id="CHAtoken2"></div>
        <p>Look on the about page</p>
    </div>
    <div class="clueContainer">
        <div class="unknown" id="CHAtoken3"></div>
        <p>Want to contact us?</p>
    </div>

    <style>
        .clueContainer {
            display: flex;
            align-items: center;
            gap: 20px;
            margin-bottom: 10px;
        }

        .unknown {
            height: 50px;
            width: 50px;
            background-color: #4d4d4d;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            color: white;
            font-size: 34px;
            font-weight: bold;
        }

        .unknown:before {
            content: "?";
        }

        .found {
            height: 50px;
            width: 50px;
            background-image: url("token.png");
            background-size: contain;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            color: white;
            font-size: 34px;
            font-weight: bold;
        }
    </style>

    <script>
        let tokens = ["CHAtoken1", "CHAtoken2", "CHAtoken3"]
        if (localStorage && localStorage.tokenHunt){
            let found = JSON.parse(localStorage.tokenHunt);
            tokens.forEach(token => {
                if (found.includes(token)){
                    document.getElementById(token).className = "found";
                }
            });
        }
    </script>
</body>
</html>
